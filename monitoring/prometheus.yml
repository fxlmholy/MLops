global:
  scrape_interval: 5s
  evaluation_interval: 15s

# P6 (M5): เกณฑ์แจ้งเตือน p95 latency / error rate / API down / ไม่มีโมเดล
rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: bakery-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
